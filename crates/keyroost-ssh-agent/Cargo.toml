[package]
name = "keyroost-ssh-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Implementation of the ssh agent protocol on top of keyroost APIs"

[lints]
workspace = true

[dependencies]
ecdsa = "0.16"
keyroost-openpgp = { path = "../keyroost-openpgp", version = "0.10.0" }
keyroost-piv = { path = "../keyroost-piv", version = "0.10.0" }
keyroost-transport = { path = "../keyroost-transport", version = "0.10.0" }
p256 = "0.13"
p384 = "0.13"
sha2 = "0.11"
signature = "2"
ssh-agent-lib = "0.6"
tokio = { version = "1", default-features = false, features = ["net"] }
tracing = "0.1"
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
